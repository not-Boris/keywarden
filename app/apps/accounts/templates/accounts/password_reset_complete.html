{% extends "base.html" %}

{% block title %}Password Updated • Keywarden{% endblock %}

{% block content %}
  <div class="mx-auto max-w-md rounded-2xl border border-gray-200 bg-white p-6 shadow-sm sm:p-8">
    <h1 class="text-2xl font-semibold tracking-tight text-gray-900">Password updated</h1>
    <p class="mt-3 text-sm text-gray-600">
      Your Keywarden password has been changed successfully.
    </p>
    <a
      href="{% url 'accounts:login' %}?native=1"
      class="mt-6 inline-flex w-full items-center justify-center rounded-lg bg-blue-700 px-5 py-2.5 text-sm font-semibold text-white hover:bg-blue-800 focus:outline-none focus:ring-4 focus:ring-blue-300"
    >
      Sign in
    </a>
  </div>
{% endblock %}
